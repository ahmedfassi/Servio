<header class="site-header" [class.scrolled]="scrolled()">
  <div class="navbar">
    <a class="logo" href="#home" aria-label="Serv.io home" (click)="activateSection('home')">
      Serv<span>.io</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="nav-panel" id="main-navigation" [class.is-open]="menuOpen()">
      <nav class="nav-links" aria-label="Main navigation">
        <a
          href="#home"
          [class.active]="activeSection() === 'home'"
          [attr.aria-current]="activeSection() === 'home' ? 'location' : null"
          (click)="activateSection('home')"
          >Home</a
        >
        <a
          href="#services"
          [class.active]="activeSection() === 'services'"
          [attr.aria-current]="activeSection() === 'services' ? 'location' : null"
          (click)="activateSection('services')"
          >Services</a
        >
        <a
          href="#about"
          [class.active]="activeSection() === 'about'"
          [attr.aria-current]="activeSection() === 'about' ? 'location' : null"
          (click)="activateSection('about')"
          >About Us</a
        >
        <a
          href="#policies"
          [class.active]="activeSection() === 'policies'"
          [attr.aria-current]="activeSection() === 'policies' ? 'location' : null"
          (click)="activateSection('policies')"
          >Policies</a
        >
      </nav>
    </div>
  </div>
</header>
