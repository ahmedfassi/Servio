<header class="site-header">
  <div class="navbar">
    <a class="logo" routerLink="/" aria-label="Serv.io home" (click)="closeMenu()">
      Serv<span>.io</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="nav-panel" id="main-navigation" [class.is-open]="menuOpen()">
      <nav class="nav-links" aria-label="Main navigation">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
          >Home</a
        >
        <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>
        <a routerLink="/policies" routerLinkActive="active" (click)="closeMenu()">Policies</a>
      </nav>
    </div>
  </div>
</header>
