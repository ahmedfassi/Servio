<footer class="footer">
  <div class="footer-grid">
    <div class="brand-block">
      <a class="logo" href="#home" [attr.aria-label]="t().footer.homeAria">Serv<span>.io</span></a>
      <p>{{ t().footer.tagline }}</p>
    </div>

    <nav [attr.aria-label]="t().footer.navigationAria">
      <p class="footer-label">{{ t().footer.explore }}</p>
      <a href="#home">{{ t().nav.home }}</a>
      <a href="#services">{{ t().nav.services }}</a>
      <a href="#about">{{ t().nav.about }}</a>
      <a href="#policies">{{ t().nav.policies }}</a>
    </nav>

    <div class="footer-cta">
      <p class="footer-label">{{ t().footer.ready }}</p>
      <h2>{{ t().footer.title }}</h2>
      <a href="#demo">{{ t().footer.bookDemo }} <span aria-hidden="true">↗</span></a>
    </div>
  </div>

  <div class="footer-bottom">
    <p>© {{ year }} {{ t().footer.copyright }}</p>
    <p>{{ t().footer.closing }}</p>
  </div>
</footer>
